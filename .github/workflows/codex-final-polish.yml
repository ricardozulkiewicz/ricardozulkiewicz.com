name: Codex Final Polish

on:
  push:
    branches:
      - codex/final-polish-20260610
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/final-polish-20260610
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply final frontend polish
        run: |
          node <<'NODE'
          const fs = require('fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function write(path, content) {
            fs.writeFileSync(path, content);
          }

          function replaceOnce(path, search, replacement) {
            const current = read(path);
            if (!current.includes(search)) {
              throw new Error(`Pattern not found in ${path}: ${search.slice(0, 90)}`);
            }
            write(path, current.replace(search, replacement));
          }

          function updateJson(path, updater) {
            const data = JSON.parse(read(path));
            updater(data);
            write(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          updateJson('package.json', (pkg) => {
            pkg.engines = { node: '>=20 <25', npm: '>=10 <12' };
          });

          updateJson('package-lock.json', (lock) => {
            lock.packages[''].engines = { node: '>=20 <25', npm: '>=10 <12' };
          });

          replaceOnce(
            'app/components/HomePage.tsx',
            'nav: [["About", "#about"], ["Expertise", "#expertise"], ["Approach", "#approach"], ["Experience", "#experience"], ["Work", "#work"], ["Contact", "#contact"]],',
            'nav: [["Expertise", "#expertise"], ["About", "#about"], ["Approach", "#approach"], ["Experience", "#experience"], ["Work", "#work"], ["Contact", "#contact"]],'
          );
          replaceOnce(
            'app/components/HomePage.tsx',
            'nav: [["Sobre", "#about"], ["Especialidades", "#expertise"], ["Abordagem", "#approach"], ["Experiência", "#experience"], ["Projetos", "#work"], ["Contato", "#contact"]],',
            'nav: [["Especialidades", "#expertise"], ["Sobre", "#about"], ["Abordagem", "#approach"], ["Experiência", "#experience"], ["Projetos", "#work"], ["Contato", "#contact"]],'
          );

          for (const path of ['app/layout.tsx', 'app/page.tsx', 'app/pt/page.tsx']) {
            replaceOnce(
              path,
              '    languages: {\n      "en-US": siteUrl,\n      "pt-BR": `${siteUrl}/pt`,\n    },',
              '    languages: {\n      "x-default": siteUrl,\n      "en-US": siteUrl,\n      "pt-BR": `${siteUrl}/pt`,\n    },'
            );
          }

          for (const path of ['app/components/CvAccessRequestPage.tsx', 'app/components/CvAccessPage.tsx']) {
            replaceOnce(path, '>CV ACCESS</div>', '>B2B TECHNOLOGY SALES</div>');
            replaceOnce(path, '\n            Home\n', '\n            Início\n');
          }

          replaceOnce('app/privacidade/page.tsx', '>PRIVACIDADE</div>', '>B2B TECHNOLOGY SALES</div>');
          replaceOnce(
            'app/termos/page.tsx',
            '<div className="text-sm font-semibold tracking-[0.18em] text-[#F7F5F0] md:text-base md:tracking-[0.24em]">RICARDO ZULKIEWICZ</div>\n              <div className="mt-2 text-[10px] font-medium tracking-[0.22em] text-[#57a6b7] md:text-xs md:tracking-[0.32em]">TERMOS DE USO</div>',
            '<div className="text-sm font-semibold tracking-[0.26em] text-[#F7F5F0] md:text-base md:tracking-[0.34em]">RICARDO ZULK</div>\n              <div className="mt-2 text-[10px] font-medium tracking-[0.22em] text-[#57a6b7] md:text-xs md:tracking-[0.32em]">B2B TECHNOLOGY SALES</div>'
          );

          for (const path of ['app/not-found.tsx', 'app/error.tsx', 'app/global-error.tsx']) {
            replaceOnce(
              path,
              '<div className="text-sm font-semibold tracking-[0.18em] text-[#F7F5F0] md:text-base md:tracking-[0.24em]">RICARDO ZULKIEWICZ</div>',
              '<div className="text-sm font-semibold tracking-[0.26em] text-[#F7F5F0] md:text-base md:tracking-[0.34em]">RICARDO ZULK</div>'
            );
          }

          replaceOnce(
            'app/error.tsx',
            '<button onClick={reset} className="inline-flex items-center justify-center gap-3 bg-[#0F4C5C] px-7 py-4 text-[11px] font-semibold uppercase tracking-[0.2em] text-[#F7F5F0] transition hover:-translate-y-0.5 hover:bg-[#126177]">',
            '<button type="button" onClick={reset} className="inline-flex items-center justify-center gap-3 bg-[#0F4C5C] px-7 py-4 text-[11px] font-semibold uppercase tracking-[0.2em] text-[#F7F5F0] transition hover:-translate-y-0.5 hover:bg-[#126177]">'
          );
          replaceOnce(
            'app/global-error.tsx',
            '<button onClick={reset} className="inline-flex items-center justify-center gap-3 bg-[#0F4C5C] px-7 py-4 text-[11px] font-semibold uppercase tracking-[0.2em] text-[#F7F5F0] transition hover:-translate-y-0.5 hover:bg-[#126177]">',
            '<button type="button" onClick={reset} className="inline-flex items-center justify-center gap-3 bg-[#0F4C5C] px-7 py-4 text-[11px] font-semibold uppercase tracking-[0.2em] text-[#F7F5F0] transition hover:-translate-y-0.5 hover:bg-[#126177]">'
          );
          NODE
      - name: Validate
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Remove temporary workflow
        run: rm .github/workflows/codex-final-polish.yml
      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/components/HomePage.tsx app/layout.tsx app/page.tsx app/pt/page.tsx app/components/CvAccessRequestPage.tsx app/components/CvAccessPage.tsx app/privacidade/page.tsx app/termos/page.tsx app/not-found.tsx app/error.tsx app/global-error.tsx .github/workflows/codex-final-polish.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply final frontend polish"
            git push origin HEAD:codex/final-polish-20260610
          fi
