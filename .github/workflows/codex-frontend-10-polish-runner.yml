name: Codex Frontend Polish Runner

on:
  workflow_dispatch:
  push:
    branches:
      - codex/frontend-10-polish-20260610

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and apply polish script
        run: |
          awk '/node <<'\''NODE'\''/ { capture=1; next } /^          NODE$/ { capture=0 } capture { sub(/^          /, ""); print }' .github/workflows/codex-frontend-10-polish.yml > /tmp/apply-polish.cjs
          node /tmp/apply-polish.cjs

      - name: Refresh dependencies and validate
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit validated polish
        run: |
          rm -f .github/workflows/codex-frontend-10-polish.yml .github/workflows/codex-frontend-10-polish-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/HomePage.tsx app/components/CvAccessPage.tsx app/components/CvAccessRequestPage.tsx app/cv/access/page.tsx app/globals.css package.json package-lock.json .github/workflows/codex-frontend-10-polish.yml .github/workflows/codex-frontend-10-polish-runner.yml
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Polish frontend experience"
          git push
