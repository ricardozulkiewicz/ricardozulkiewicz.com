name: Codex Inline Style Cleanup

on:
  push:
    branches:
      - codex/inline-style-cleanup-20260609

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[codex-apply-inline-style-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/inline-style-cleanup-20260609
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply cleanup
        run: |
          node <<'JS'
          const fs = require('fs');

          const files = [
            'app/components/HomePage.tsx',
            'app/components/CvAccessPage.tsx',
            'app/components/CvAccessRequestPage.tsx',
            'app/cv/access/page.tsx',
            'app/not-found.tsx',
            'app/privacidade/page.tsx',
            'app/termos/page.tsx',
          ];

          const utilityBlock = `.hairline {
            border-color: rgba(247, 245, 240, 0.14);
          }

          .dark-hairline {
            border-color: rgba(31, 31, 31, 0.12);
          }

          .soft-glow {
            box-shadow: 0 0 80px rgba(15, 76, 92, 0.22);
          }
          `;

          const styleBlockPattern = /\s*<style>\{`\s*:root\s*\{\s*font-family:\s*Montserrat,[\s\S]*?\.soft-glow\s*\{\s*box-shadow:\s*0\s+0\s+80px\s+rgba\(15,\s*76,\s*92,\s*0\.22\);\s*\}\s*`}<\/style>/g;

          let css = fs.readFileSync('app/globals.css', 'utf8');
          if (!css.includes('.hairline {')) {
            css = css.replace(/\n\.tracking-\\\[-0\\\.075em\\\],/, `\n${utilityBlock}\n.tracking-\\[-0\\.075em\\],`);
            fs.writeFileSync('app/globals.css', css);
          }

          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replace(styleBlockPattern, '');
            if (after.includes('<style')) {
              throw new Error(`Inline style block still present in ${file}`);
            }
            if (before !== after) {
              fs.writeFileSync(file, after);
            }
          }

          fs.rmSync('.github/workflows/codex-inline-style-cleanup.yml', { force: true });
          JS
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css app/components/HomePage.tsx app/components/CvAccessPage.tsx app/components/CvAccessRequestPage.tsx app/cv/access/page.tsx app/not-found.tsx app/privacidade/page.tsx app/termos/page.tsx .github/workflows/codex-inline-style-cleanup.yml
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate inline typography styles"
          git push origin codex/inline-style-cleanup-20260609
